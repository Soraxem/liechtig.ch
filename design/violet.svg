<svg height="100" width="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    <filter id="paper">
    <!-- c094e94b-6ccf-4eb4-8ab8-1e07766c2c87 -->
        <feTurbulence baseFrequency="0.2,0.7" numOctaves="10" type="fractalNoise" result="noise"></feTurbulence>
<!-- c9c79f18-2ca7-4233-b260-631edf6157e5 -->
        <feColorMatrix values="
            1 1 1 -0.9 0
            1 1 1 -0.9 0
            1 1 1 -0.9 0
            0 0 0 0 1"
            result="speckles" in="noise"></feColorMatrix>
<!-- 7884f94f-2b1e-4ec8-8c05-ec29d255ee4e -->
        <feTurbulence baseFrequency="0.002,0.0046" seed="0.4" stitchTiles="stitch" result="turbulence"></feTurbulence>
<!-- 7853f5d6-1ece-4bd9-8505-e2e13883f88e -->
        <feColorMatrix values="1 1 1 -0.4 0
            1 1 1 -0.4 0
            1 1 1 -0.4 0
            0 0 0 0 1"
            result="bw-turbulence" in="turbulence"></feColorMatrix>
<!-- 9d847f7d-2c8a-4d48-b6a8-2f29b4a06565 -->
        <feGaussianBlur stdDeviation="20" edgeMode="wrap" result="smooth-turbulence" in="bw-turbulence"></feGaussianBlur>
<!-- 4a9bc309-1639-479c-8510-db3f83b60166 -->
        <feComposite operator="arithmetic" k1="0.5" k3="0.5" result="turbulence-and-speckles" in="smooth-turbulence" in2="speckles"></feComposite>
<!-- 4d042c6d-5d50-44fa-a4f3-57015fbc4565 -->
        <feComposite operator="arithmetic" k1="0.5" k2="0.5" result="result" in="SourceGraphic" in2="turbulence-and-speckles"></feComposite>
    </filter>

        <rect x="0" y="0" width="100%" height="100%" style="fill:#48389d; filter:url(#paper)" />


    </svg>

