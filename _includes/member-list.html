

<div class="member-list">

    {% for member in site.members %}

        <div class="member">  

            {% if member.image %}
                    <img class="member-image" src="{{ member.image }}">
                    <img class="member-hover-image" src="{{ member.hover }}">

            {% endif %}

            <div class="paper secondary member-info">
                <h2 class="member-title">{{ member.title }}</h2>

                {% for p in member.intro %}
                    <p>{{ p }}</p>
                {% endfor %}

                {% if member.quote %}
                    <cite>{{ member.quote }}</cite>
                {% endif %}
            </div>

        </div>

    {% endfor %}

</div>
